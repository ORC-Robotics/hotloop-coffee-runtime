name: Release quente Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            python-version: "3.13"
            artifact-name: quente-windows-portable
            asset-glob: frontend/release/quente-*.exe
          - os: ubuntu-22.04
            platform: linux
            python-version: "3.12"
            artifact-name: quente-linux
            asset-glob: |
              frontend/release/quente-*.AppImage
              frontend/release/quente-*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate tag version matches frontend package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: frontend
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Git tag version v$TAG_VERSION does not match frontend/package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build desktop packages
        working-directory: frontend
        run: npm run build:desktop

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.asset-glob }}
          if-no-files-found: error
          retention-days: 3

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset-glob }}
          generate_release_notes: true
